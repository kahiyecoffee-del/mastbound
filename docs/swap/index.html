<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastbound · Swap</title>
<link rel="icon" href="../logo.png">
<script>document.write('<script src="../config.js?v=' + Date.now() + '"><\/script>')</script>
<script src="https://plugin.jup.ag/plugin-v1.js" data-preload defer></script>
<style>
  :root { --bg:#0a0d12; --card:#12161e; --line:#232a36; --ink:#f5f7fa; --ink2:#a0aab8; --ink3:#687280; --gold:#f0c45c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(900px 500px at 90% -10%, rgba(240,196,92,.18), transparent 60%), var(--bg);
         color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 48px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  header img { width:44px; height:44px; }
  .brand { font-weight:800; letter-spacing:.18em; } .sub { color:var(--gold); font-size:11px; letter-spacing:.24em; }
  #jup { min-height:560px; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:var(--card); }
  .note { color:var(--ink3); font-size:13px; margin-top:14px; }
  .note b { color:var(--ink2); }
</style>
</head>
<body>
<main>
  <header><img src="../logo.png" alt=""><div><div class="brand">MASTBOUND</div><div class="sub">SWAP</div></div></header>
  <div id="jup"></div>
  <p class="note" id="fee"></p>
  <p class="note"><b>Powered by Jupiter.</b> Your wallet signs every swap — Mastbound never holds your funds.
     Always check the token address. Not financial advice.</p>
</main>
<script>
  const cfg = window.MASTBOUND || {};
  const form = { initialInputMint: "So11111111111111111111111111111111111111112" };
  if (cfg.mint) form.initialOutputMint = cfg.mint;
  if (cfg.referralAccount) { form.referralAccount = cfg.referralAccount; form.referralFee = Math.min(255, Math.max(50, cfg.feeBps || 50)); }
  document.getElementById("fee").textContent = cfg.referralAccount
    ? `Includes a ${(form.referralFee / 100).toFixed(2)}% Mastbound platform fee, shown in the quote before you sign.`
    : "";
  window.addEventListener("load", () => window.Jupiter.init({
    displayMode: "integrated",
    integratedTargetId: "jup",
    branding: { name: "Mastbound", logoUri: new URL("../logo.png", location.href).href },
    formProps: form,
  }));
</script>
</body>
</html>
