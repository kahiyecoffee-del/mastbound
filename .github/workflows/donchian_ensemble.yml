name: donchian-ensemble-research
on:
  workflow_dispatch:
  push:
    paths:
      - "research/donchian_ensemble.py"
      - ".github/workflows/donchian_ensemble.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas numpy
      - run: python research/donchian_ensemble.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donchian-ensemble-results
          path: results/donchian_ensemble/report.txt
