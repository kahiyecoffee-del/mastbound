name: quarter-hour-research
on:
  workflow_dispatch:
  push:
    paths:
      - "research/quarter_hour.py"
      - ".github/workflows/quarter_hour.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas numpy
      - run: python research/quarter_hour.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarter-hour-results
          path: results/quarter_hour/report.txt
