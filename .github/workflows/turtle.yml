name: turtle-research
on:
  workflow_dispatch:
  push:
    paths:
      - "research/turtle.py"
      - ".github/workflows/turtle.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas numpy
      - run: python research/turtle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turtle-results
          path: results/turtle/report.txt
