name: bab-research
on:
  workflow_dispatch:
  push:
    paths:
      - "research/bab.py"
      - ".github/workflows/bab.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas numpy
      - run: python research/bab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bab-results
          path: results/bab/report.txt
